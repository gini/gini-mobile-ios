name: Upload iOS App to TestFlight (Reusable)
permissions:
  contents: read 
# Reusable workflow — call this from any SDK's publish workflow.
# Example caller:
#
#   jobs:
#     upload:
#       uses: ./.github/workflows/publish.example.app.testflight.yml
#       with:
#         xcode_version: '26.2'
#         project_path: 'BankSDK/GiniBankSDKExample/GiniBankSDKExample.xcodeproj'
#         scheme: 'GiniBankSDKExample'
#         bundle_identifier: 'net.gini.banksdk.example'
#         bundle_identifier_extension: 'net.gini.banksdk.example.ShareExtension'
#         ipa_name: 'GiniBankSDKExample'
#       secrets: inherit

on:
  workflow_call:
    inputs:
      xcode_version:
        description: 'Xcode version to use'
        required: false
        default: '26.2'
        type: string
      project_path:
        description: 'Relative path to the .xcodeproj file'
        required: true
        type: string
      scheme:
        description: 'Xcode scheme to build'
        required: true
        type: string
      bundle_identifier:
        description: 'Main app bundle identifier'
        required: true
        type: string
      bundle_identifier_extension:
        description: 'Share extension bundle identifier (optional)'
        required: false
        default: ''
        type: string
      ipa_name:
        description: 'Output IPA filename without extension'
        required: true
        type: string
      team_id:
        description: 'Apple Developer Team ID'
        required: false
        default: 'JA825X8F7Z'
        type: string
      credentials_plist_path:
        description: 'Relative path to a Credentials.plist to inject Gini client credentials into (plutil style, e.g. BankSDK example)'
        required: false
        default: ''
        type: string
      credentials_manager_path:
        description: 'Relative path to a CredentialsManager.swift to inject Gini client credentials into (sed style, e.g. HealthSDK example)'
        required: false
        default: ''
        type: string
      google_services_plist_path:
        description: 'Relative path to the GoogleService-Info.plist whose placeholder API_KEY must be replaced before archiving'
        required: false
        default: ''
        type: string
    secrets:
      MATCH_GIT_URL:
        required: true
      MATCH_PASSWORD:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      APP_STORE_CONNECT_API_KEY:
        required: true
      APP_STORE_API_KEY_ID:
        required: true
      APP_STORE_API_KEY_ISSUER_ID:
        required: true
      FIREBASE_API_KEY:
        required: false
      GINI_MOBILE_CI_USERNAME:
        required: false
      GINI_MOBILE_CI_PASSWORD:
        required: false

jobs:
  upload-testflight:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ inputs.xcode_version }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@dffc446db9ba5a0c4446edb5bca1c5c473a806c5 # v1.245.0
        with:
          ruby-version: '3.2.0'
          bundler-cache: true

      - name: Download Signing Certificates & Profiles (Match)
        env:
          APP_IDENTIFIER: >-
            ${{ inputs.bundle_identifier }}${{
              inputs.bundle_identifier_extension != '' &&
              format(',{0}', inputs.bundle_identifier_extension) || ''
            }}
          GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          DISTRIBUTION_TYPE=appstore bundle exec fastlane download_profiles
          # The AdHoc profile is needed only for the main app target: its Release build
          # configuration signs with "match AdHoc <bundle_id>" at archive time (the export
          # step then re-signs with the AppStore profiles above). Extension targets sign
          # with AppStore profiles in Release, so they are excluded here on purpose.
          DISTRIBUTION_TYPE=adhoc APP_IDENTIFIER=${{ inputs.bundle_identifier }} bundle exec fastlane download_profiles

      - name: Setup Credentials (plist)
        if: inputs.credentials_plist_path != ''
        env:
          TEST_CLIENT_ID: ${{ secrets.GINI_MOBILE_CI_USERNAME }}
          TEST_CLIENT_SECRET: ${{ secrets.GINI_MOBILE_CI_PASSWORD }}
        run: |
          if [ -z "$TEST_CLIENT_ID" ] || [ -z "$TEST_CLIENT_SECRET" ]; then
            echo "GINI_MOBILE_CI_USERNAME/GINI_MOBILE_CI_PASSWORD secrets are empty — refusing to ship placeholder credentials" >&2
            exit 1
          fi
          plutil -replace client_id -string "$TEST_CLIENT_ID" "${{ inputs.credentials_plist_path }}"
          plutil -replace client_password -string "$TEST_CLIENT_SECRET" "${{ inputs.credentials_plist_path }}"

      - name: Setup Credentials (CredentialsManager.swift)
        if: inputs.credentials_manager_path != ''
        env:
          TEST_CLIENT_ID: ${{ secrets.GINI_MOBILE_CI_USERNAME }}
          TEST_CLIENT_SECRET: ${{ secrets.GINI_MOBILE_CI_PASSWORD }}
        run: |
          if [ -z "$TEST_CLIENT_ID" ] || [ -z "$TEST_CLIENT_SECRET" ]; then
            echo "GINI_MOBILE_CI_USERNAME/GINI_MOBILE_CI_PASSWORD secrets are empty — refusing to ship placeholder credentials" >&2
            exit 1
          fi
          sed -i '' \
          -e "s/clientID = \"client_id\"/clientID = \"$TEST_CLIENT_ID\"/" \
          -e "s/clientPassword = \"client_password\"/clientPassword = \"$TEST_CLIENT_SECRET\"/" \
          "${{ inputs.credentials_manager_path }}"

      - name: Setup Firebase API Key
        if: inputs.google_services_plist_path != ''
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "FIREBASE_API_KEY secret is empty — refusing to ship placeholder API key (app would crash at launch)" >&2
            exit 1
          fi
          plutil -replace API_KEY -string "$FIREBASE_API_KEY" "${{ inputs.google_services_plist_path }}"

      - name: Archive Xcode Project
        run: |
          xcodebuild clean archive \
            -project ${{ inputs.project_path }} \
            -scheme "${{ inputs.scheme }}" \
            -archivePath ./${{ inputs.ipa_name }}.xcarchive \
            -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ inputs.team_id }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ONLY_ACTIVE_ARCH=NO

      - name: Export .ipa File
        run: |
          xcodebuild -exportArchive \
            -archivePath ${{ inputs.ipa_name }}.xcarchive \
            -exportPath . \
            -exportOptionsPlist ExportOptionsAppStore${{ inputs.ipa_name }}.plist

      - name: Verify .ipa File
        uses: andstor/file-existence-action@v3
        with:
          files: "${{ inputs.ipa_name }}.ipa"
          fail: true

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane publish_to_testflight ipa_path:"${{ inputs.ipa_name }}.ipa"
