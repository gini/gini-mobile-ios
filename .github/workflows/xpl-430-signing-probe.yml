name: XPL-430 signing probe (throwaway)

# One-shot probe to find out which GitHub commit APIs auto-sign commits
# when authenticated as the MOBILE_CI_APP installation. Dispatched manually
# via `gh workflow run xpl-430-signing-probe.yml --ref <branch>`.
#
# This workflow is intentionally NOT on `main` — it only lives on the
# XPL-430 branch and will be deleted after the result is captured.
#
# What it does, per API endpoint:
#   1. Mint an installation token from MOBILE_CI_APP (same as sdk.publish.docs.yml).
#   2. Create a commit via that endpoint against gini/gini-mobile-ios.
#   3. Fetch the resulting commit's `verification` object.
#   4. Print pass/fail into the job summary.
#   5. Clean up any throwaway branch it created.
#
# Side effects:
#   - 1 orphan commit object on gini/gini-mobile-ios from POST /git/commits.
#     Not reachable from any branch; GitHub GCs orphan objects on its own
#     schedule (~2 weeks).
#   - 2 temporary branches `signing-probe-<run>-{contents,graphql}` created
#     and deleted inside the job.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mint App installation token (same recipe as sdk.publish.docs.yml)
        id: generate-token
        uses: actions/create-github-app-token@064492a9a1762067169d50c792a7dc02bc3d1254 # v2.0.0
        with:
          app-id: ${{ secrets.MOBILE_CI_APP_ID }}
          private-key: ${{ secrets.MOBILE_CI_APP_PRIVATE_KEY }}
          owner: gini

      - name: Probe 1 — REST POST /git/commits
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          REPO: gini/gini-mobile-ios
        run: |
          set -euo pipefail
          PARENT=$(gh api "repos/$REPO/git/refs/heads/main" --jq .object.sha)
          TREE=$(gh api "repos/$REPO/git/commits/$PARENT" --jq .tree.sha)
          SHA=$(gh api "repos/$REPO/git/commits" \
            -f message="XPL-430 probe: POST /git/commits with App token" \
            -f tree="$TREE" \
            -f "parents[]=$PARENT" \
            --jq .sha)
          VERIFIED=$(gh api "repos/$REPO/git/commits/$SHA" --jq .verification.verified)
          REASON=$(gh api "repos/$REPO/git/commits/$SHA" --jq .verification.reason)
          AUTHOR=$(gh api "repos/$REPO/git/commits/$SHA" --jq .author.name)
          echo "endpoint=POST /git/commits  sha=$SHA  verified=$VERIFIED  reason=$REASON  author=$AUTHOR"
          {
            echo "## POST /git/commits"
            echo "- sha: \`$SHA\`"
            echo "- **verified: \`$VERIFIED\`**"
            echo "- reason: \`$REASON\`"
            echo "- author: \`$AUTHOR\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe 2 — REST PUT /contents
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          REPO: gini/gini-mobile-ios
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BRANCH="signing-probe-contents-$RUN_ID"
          MAIN_SHA=$(gh api "repos/$REPO/git/refs/heads/main" --jq .object.sha)
          gh api -X POST "repos/$REPO/git/refs" \
            -f ref="refs/heads/$BRANCH" \
            -f sha="$MAIN_SHA" > /dev/null
          CONTENT=$(printf "probe" | base64)
          SHA=$(gh api -X PUT "repos/$REPO/contents/.xpl430-probe-$BRANCH.txt" \
            -f message="XPL-430 probe: PUT /contents with App token" \
            -f content="$CONTENT" \
            -f branch="$BRANCH" \
            --jq .commit.sha)
          VERIFIED=$(gh api "repos/$REPO/git/commits/$SHA" --jq .verification.verified)
          REASON=$(gh api "repos/$REPO/git/commits/$SHA" --jq .verification.reason)
          AUTHOR=$(gh api "repos/$REPO/git/commits/$SHA" --jq .author.name)
          echo "endpoint=PUT /contents  sha=$SHA  verified=$VERIFIED  reason=$REASON  author=$AUTHOR"
          {
            echo "## PUT /contents"
            echo "- sha: \`$SHA\`"
            echo "- **verified: \`$VERIFIED\`**"
            echo "- reason: \`$REASON\`"
            echo "- author: \`$AUTHOR\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # Cleanup
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || true

      - name: Probe 3 — GraphQL createCommitOnBranch
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          REPO: gini/gini-mobile-ios
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BRANCH="signing-probe-graphql-$RUN_ID"
          MAIN_SHA=$(gh api "repos/$REPO/git/refs/heads/main" --jq .object.sha)
          gh api -X POST "repos/$REPO/git/refs" \
            -f ref="refs/heads/$BRANCH" \
            -f sha="$MAIN_SHA" > /dev/null
          CONTENT=$(printf "probe" | base64)
          # Build GraphQL input as a JSON file to avoid shell quoting hell
          cat > /tmp/input.json <<EOF
          {
            "input": {
              "branch": {
                "repositoryNameWithOwner": "$REPO",
                "branchName": "$BRANCH"
              },
              "expectedHeadOid": "$MAIN_SHA",
              "fileChanges": {
                "additions": [
                  {
                    "path": ".xpl430-probe-$BRANCH.txt",
                    "contents": "$CONTENT"
                  }
                ]
              },
              "message": {
                "headline": "XPL-430 probe: GraphQL createCommitOnBranch with App token"
              }
            }
          }
          EOF
          SHA=$(gh api graphql \
            -f query='mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            --input /tmp/input.json \
            --jq .data.createCommitOnBranch.commit.oid)
          VERIFIED=$(gh api "repos/$REPO/git/commits/$SHA" --jq .verification.verified)
          REASON=$(gh api "repos/$REPO/git/commits/$SHA" --jq .verification.reason)
          AUTHOR=$(gh api "repos/$REPO/git/commits/$SHA" --jq .author.name)
          echo "endpoint=GraphQL createCommitOnBranch  sha=$SHA  verified=$VERIFIED  reason=$REASON  author=$AUTHOR"
          {
            echo "## GraphQL createCommitOnBranch"
            echo "- sha: \`$SHA\`"
            echo "- **verified: \`$VERIFIED\`**"
            echo "- reason: \`$REASON\`"
            echo "- author: \`$AUTHOR\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # Cleanup
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || true
