name: 'Setup .env.local'
description: >
  Writes BankSDK/GiniBankSDKExample/.env.local from CI secrets so the example
  app's build-phase script can generate Credentials.swift and inject the
  Firebase API_KEY into GoogleService-Info.plist. Pulls the duplicated block
  out of bank-sdk.check.yml, bank-sdk.publish.example.app.firebase.yml, and
  publish.example.app.testflight.yml into one place.

inputs:
  gini_client_id:
    description: 'Gini CI client ID (secret GINI_MOBILE_CI_USERNAME).'
    required: true
  gini_client_password:
    description: 'Gini CI client password (secret GINI_MOBILE_CI_PASSWORD).'
    required: true
  gini_cx_client_id:
    description: 'Gini CI CX client ID (secret GINI_MOBILE_CI_CX_USERNAME). Optional.'
    required: false
    default: ''
  gini_cx_client_password:
    description: 'Gini CI CX client password (secret GINI_MOBILE_CI_CX_PASSWORD). Optional.'
    required: false
    default: ''
  firebase_api_key:
    description: 'Firebase API_KEY (secret FIREBASE_API_KEY).'
    required: true
  require_production_values:
    description: >
      When "true", abort with a non-zero exit if GINI_CLIENT_ID/PASSWORD or
      FIREBASE_API_KEY are empty. Use for TestFlight/Firebase jobs so a
      secrets-misconfigured run never ships a placeholder build.
    required: false
    default: 'false'
  env_local_path:
    description: >
      Path to the .env.local file to write. Defaults to the Bank example app
      path so existing Bank callers keep working unchanged; Health's TestFlight
      caller overrides it with the Health example app path (PP-3923).
    required: false
    default: 'BankSDK/GiniBankSDKExample/.env.local'

runs:
  using: composite
  steps:
    - name: Write .env.local
      shell: bash
      env:
        GINI_CLIENT_ID: ${{ inputs.gini_client_id }}
        GINI_CLIENT_PASSWORD: ${{ inputs.gini_client_password }}
        GINI_CX_CLIENT_ID: ${{ inputs.gini_cx_client_id }}
        GINI_CX_CLIENT_PASSWORD: ${{ inputs.gini_cx_client_password }}
        FIREBASE_API_KEY: ${{ inputs.firebase_api_key }}
        REQUIRE_PRODUCTION_VALUES: ${{ inputs.require_production_values }}
        ENV_LOCAL_PATH: ${{ inputs.env_local_path }}
      run: |
        if [ "$REQUIRE_PRODUCTION_VALUES" = "true" ]; then
          if [ -z "$GINI_CLIENT_ID" ] || [ -z "$GINI_CLIENT_PASSWORD" ]; then
            echo "GINI_MOBILE_CI_USERNAME/GINI_MOBILE_CI_PASSWORD secrets are empty — refusing to ship placeholder credentials" >&2
            exit 1
          fi
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "FIREBASE_API_KEY secret is empty — refusing to ship placeholder API key (app would crash at launch)" >&2
            exit 1
          fi
        fi
        mkdir -p "$(dirname "$ENV_LOCAL_PATH")"
        cat > "$ENV_LOCAL_PATH" <<ENV
        GINI_CLIENT_ID=$GINI_CLIENT_ID
        GINI_CLIENT_PASSWORD=$GINI_CLIENT_PASSWORD
        GINI_CLIENT_DOMAIN=gini.net
        GINI_CX_CLIENT_ID=$GINI_CX_CLIENT_ID
        GINI_CX_CLIENT_PASSWORD=$GINI_CX_CLIENT_PASSWORD
        GINI_STAGE_CLIENT_ID=
        GINI_STAGE_CLIENT_PASSWORD=
        FIREBASE_API_KEY=$FIREBASE_API_KEY
        ENV
